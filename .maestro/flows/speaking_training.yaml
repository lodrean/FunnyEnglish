# Flow: гость — полный путь Library → Topics → Video → Questions → Training (спека §10.2)
# Требует: docker-стек с seed-контентом («Разговорный английский» / «Знакомство»).
# Запись на эмуляторе — виртуальный микрофон, permissions выдаются при запуске.

appId: com.sotospeak.app
---
- launchApp:
    clearState: true
    permissions:
      android.permission.RECORD_AUDIO: allow

# Онбординг → гость
# Онбординг после clearState: сплэш на холодном старте держится >10с —
# when-условие успевает скипнуть подфлоу (грабля №54). Ждём слайд безусловно.
- extendedWaitUntil:
    visible: "Смотри видео"
    timeout: 30000
- runFlow:
    file: ../subflows/onboarding_guest.yaml

# Library — стартовый экран (E2E-библиотеки могут быть сверху — скроллим до seed)
# Холодный старт: первый запрос Library может таймаутить — ретраим
- runFlow:
    when:
      visible: "Попробовать снова"
    commands:
      - tapOn: "Попробовать снова"

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- assertVisible: "Разговорный английский"

# Topics
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"

# Video: bottom-sheet удалён (DC-5) — клик по топику открывает сразу видео,
# mode-chips «С субтитрами/Без субтитров» на экране видео (seed-топик с субтитрами)
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- assertVisible: "С субтитрами"
- tapOn: "Без субтитров"

# CTA «Перейти к вопросам» доступен всегда (видео может не грузиться с эмулятора — не критично)
- tapOn: "Перейти к вопросам"

# Questions — весь список вопросов
- extendedWaitUntil:
    visible: "What is your name?"
    timeout: 15000
- assertVisible: "Where are you from?"
- tapOn: "Тренировка · 3 попытки"

# Training — уровень 1, лимит 80 сек, одна запись на все вопросы
- extendedWaitUntil:
    visible: "Уровень 1 · 80 сек"
    timeout: 15000
- assertVisible: ".*ответь на все вопросы одной записью.*"

# Запись: record-кнопка (contentDescription) → ~3 сек по таймеру (1:20 → 1:17) → стоп
# (досрочный стоп засчитывается)
- tapOn: "Начать запись"
- extendedWaitUntil:
    visible: "1:17"
    timeout: 15000
- tapOn: "Остановить запись"

# Карточка самооценки (спека §5.4, bd h3l.5): появляется между rec-зоной и списком
# попыток — эталон-транскрипт + чеклист 4 критерия по рубрике учителя
- scrollUntilVisible:
    element:
      text: "Оцени попытку 1"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*Эталонный ответ.*"
# Чеклист ниже секции эталона (транскрипт до 180dp) — скроллим к критериям
- scrollUntilVisible:
    element:
      text: ".*Грамматика.*"
    direction: DOWN
    timeout: 10000
- assertVisible: ".*Грамматика.*"
- scrollUntilVisible:
    element:
      text: ".*Беглость.*"
    direction: DOWN
    timeout: 10000
- assertVisible: ".*Беглость.*"

# Попытка сохранена, ✅ автоматически; заголовок списка «Попытки · N из 3» — ниже карточки
- scrollUntilVisible:
    element:
      text: "Попытки · 1 из 3"
    direction: DOWN
    timeout: 10000
- assertVisible: "Попытки · 1 из 3"

# Следующий уровень разблокирован (level-chip вверху экрана)
- scrollUntilVisible:
    element:
      text: "Уровень 2 · 50 сек"
    direction: UP
    timeout: 10000
- assertVisible: "Уровень 2 · 50 сек"
