# Integration test profile configuration
# Used for integration tests with PostgreSQL

spring:
  application:
    name: funnyenglish-backend-integration-test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:funnyenglish_integration}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false  # Allow clean for tests

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:integration-test-jwt-secret-key}
    expiration: 86400000  # 24 hours

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-url: ${S3_PUBLIC_URL:${S3_ENDPOINT:http://localhost:9000}}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:funnyenglish}
    region: ${S3_REGION:us-east-1}

  cors:
    allowed-origins: "*"

  admin:
    email: ${ADMIN_EMAIL:admin@funnyenglish.com}
    password: ${ADMIN_PASSWORD:admin123}
    display-name: ${ADMIN_DISPLAY_NAME:TestAdmin}

logging:
  level:
    com.funnyenglish: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
