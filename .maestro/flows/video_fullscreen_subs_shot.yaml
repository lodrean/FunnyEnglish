# Flow: скриншот overlay-субтитров в fullscreen (спека §2.3, v1.8)
# fullscreen ДО старта → play → скриншот сразу (cue 0–4с: "Hello! Nice to meet you.")
appId: com.sotospeak.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"
- extendedWaitUntil:
    visible: "На весь экран"
    timeout: 25000
- tapOn: "На весь экран"
- tapOn: "Смотреть видео"
- assertVisible: ".*Nice to meet you.*"
