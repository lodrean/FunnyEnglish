spring:
  application:
    name: sotospeak-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sotospeak}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:} # REQUIRED: set via env variable (no default — security)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # OSIV off: сессия не держится весь запрос — lazy-доступ вне @Transactional падает,
    # N+1 не маскируется. Все read-методы сервисов обязаны иметь @Transactional(readOnly = true).
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Батчевая догрузка lazy-коллекций вместо N+1 (для пейджированных списков,
        # где join-fetch коллекции невозможен без in-memory пагинации)
        default_batch_fetch_size: 16

  # SMTP (staging — Mailpit, prod — внешний провайдер; креды только через env)
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OAuth2 disabled - configure GOOGLE_CLIENT_ID, VK_CLIENT_ID etc to enable
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID:}
  #           client-secret: ${GOOGLE_CLIENT_SECRET:}
  #           scope: email, profile
  #         vk:
  #           client-id: ${VK_CLIENT_ID:}
  #           client-secret: ${VK_CLIENT_SECRET:}
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #           scope: email
  #       provider:
  #         vk:
  #           authorization-uri: https://oauth.vk.com/authorize
  #           token-uri: https://oauth.vk.com/access_token
  #           user-info-uri: https://api.vk.com/method/users.get?v=5.131&fields=photo_200
  #           user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:} # REQUIRED: min 32 chars, set via env variable
    expiration: 86400000 # 24 hours
    # TTL refresh-токена (отдельный JWT с JTI, ротация и отзыв — bd FunnyEnglish-nj2.7).
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  oauth:
    # OAuth-логин отключён до реализации верификации токена у провайдера (SEC, PROJECT-REVIEW Б3):
    # без проверки у Google/VK/Telegram клиентский token подделывается (account-takeover).
    enabled: ${OAUTH_ENABLED:false}

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-url: ${S3_PUBLIC_URL:${S3_ENDPOINT:http://localhost:9000}}
    access-key: ${S3_ACCESS_KEY:} # REQUIRED: set via env variable (no default — security)
    secret-key: ${S3_SECRET_KEY:} # REQUIRED: set via env variable (no default — security)
    bucket: ${S3_BUCKET:sotospeak}
    region: ${S3_REGION:us-east-1}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173,http://localhost:5174}

  admin:
    email: ${ADMIN_EMAIL:admin@sotospeak.com}
    password: ${ADMIN_PASSWORD:} # REQUIRED: set via env variable
    display-name: ${ADMIN_DISPLAY_NAME:Admin}

  # Демо-пользователь demo@sotospeak.app/demo123 — ТОЛЬКО для dev (DEMO_USER_ENABLED=true в docker-compose)
  demo-user:
    enabled: ${DEMO_USER_ENABLED:false}

  # Email-верификация (OpenSpec add-email-verification): false — поведение как раньше;
  # true (staging/prod) — регистрация без auto-login, login блокируется до подтверждения почты
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    token-ttl-hours: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
  # Публичный base URL API для ссылок в письмах (https://api.yourdomain.com — БЕЗ /api)
  public-url: ${PUBLIC_APP_URL:http://localhost:8080}
  # From-адрес писем верификации
  mail-from: ${MAIL_FROM:noreply@sotospeak.local}

logging:
  level:
    com.sotospeak: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}
    org.apache.coyote.http11: ${TOMCAT_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  # Файловый лог с ротацией (OpenSpec add-client-logging). В docker — volume ./logs:/app/logs
  file:
    name: ${LOG_FILE:logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:10MB}
      max-history: ${LOG_FILE_MAX_HISTORY:7}
      total-size-cap: ${LOG_FILE_TOTAL_CAP:200MB}

# Actuator: только health (используется docker healthcheck и CI deploy check)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Mail — не liveness-dependency: в dev SMTP нет, иначе health=DOWN и падает docker healthcheck
    mail:
      enabled: false

# HTTP client timeouts
rest:
  client:
    connect-timeout: 5000
    read-timeout: 30000
