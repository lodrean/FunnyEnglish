# Flow: скриншот overlay-субтитров в fullscreen (спека §2.3, v1.8)
# fullscreen ДО старта → play → скриншот сразу (cue 0–4с: "Hello! Nice to meet you.")
appId: com.sotospeak.app
---
- launchApp:
    clearState: true
# Онбординг после clearState: сплэш на холодном старте держится >10с —
# when-условие успевает скипнуть подфлоу (грабля №54). Ждём слайд безусловно.
- extendedWaitUntil:
    visible: "Смотри видео"
    timeout: 30000
- runFlow:
    file: ../subflows/onboarding_guest.yaml
# Холодный старт: первый запрос Library может таймаутить — ретраим
- runFlow:
    when:
      visible: "Попробовать снова"
    commands:
      - tapOn: "Попробовать снова"

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"
- extendedWaitUntil:
    visible: "На весь экран"
    timeout: 25000
- tapOn: "На весь экран"
- tapOn: "Смотреть видео"
- assertVisible: ".*Nice to meet you.*"
