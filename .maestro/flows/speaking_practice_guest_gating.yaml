# Flow: гость — Practice заблокирован (SpeakingGate на QuestionsScreen), CTA ведёт на логин (спека §10.2, PRD Story 3)

appId: com.sotospeak.app
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"

# Видео: bottom-sheet удалён (DC-5) — пропускаем видео через CTA «Перейти к вопросам»
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- tapOn: "Перейти к вопросам"

# Questions: у гостя вместо кнопки Practice — SpeakingGate в нижней зоне экрана
- extendedWaitUntil:
    visible: "Ты почти у цели!"
    timeout: 15000
- assertVisible: "Отправка записи учителю доступна после регистрации"
- assertVisible: "Тренировка · 3 попытки"

# Тап по «Войти» в гейте → экран логина
- tapOn: "Войти"
- extendedWaitUntil:
    visible: "С возвращением!"
    timeout: 10000
