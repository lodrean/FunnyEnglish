# Subflow: первый запуск — онбординг (3 слайда: «Смотри видео» → «Тренируйся вслух» → «Отправь учителю»),
# «Далее»×2 → «Начать» → Library. Гость-first: регистрации на онбординге нет,
# гостевая сессия стартует синхронно до навигации.
# Вызывать через runFlow+when (visible: "Смотри видео") после launchApp.
appId: com.sotospeak.app
---
- tapOn: "Далее"
- waitForAnimationToEnd
- tapOn: "Далее"
- waitForAnimationToEnd
- tapOn: "Начать"

# Тап иногда проглатывается во время перекомпоновки — если остались на онбординге, повторяем.
- runFlow:
    when:
      visible: "Начать"
    commands:
      - tapOn: "Начать"

- extendedWaitUntil:
    notVisible: "Начать"
    timeout: 10000
