spring:
  application:
    name: funnyenglish-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:funnyenglish}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:} # REQUIRED: set via env variable (no default — security)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OAuth2 disabled - configure GOOGLE_CLIENT_ID, VK_CLIENT_ID etc to enable
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID:}
  #           client-secret: ${GOOGLE_CLIENT_SECRET:}
  #           scope: email, profile
  #         vk:
  #           client-id: ${VK_CLIENT_ID:}
  #           client-secret: ${VK_CLIENT_SECRET:}
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #           scope: email
  #       provider:
  #         vk:
  #           authorization-uri: https://oauth.vk.com/authorize
  #           token-uri: https://oauth.vk.com/access_token
  #           user-info-uri: https://api.vk.com/method/users.get?v=5.131&fields=photo_200
  #           user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:} # REQUIRED: min 32 chars, set via env variable
    expiration: 86400000 # 24 hours

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-url: ${S3_PUBLIC_URL:${S3_ENDPOINT:http://localhost:9000}}
    access-key: ${S3_ACCESS_KEY:} # REQUIRED: set via env variable (no default — security)
    secret-key: ${S3_SECRET_KEY:} # REQUIRED: set via env variable (no default — security)
    bucket: ${S3_BUCKET:funnyenglish}
    region: ${S3_REGION:us-east-1}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3002,http://localhost:5173,http://localhost:5174}

  admin:
    email: ${ADMIN_EMAIL:admin@funnyenglish.app}
    password: ${ADMIN_PASSWORD:} # REQUIRED: set via env variable
    display-name: ${ADMIN_DISPLAY_NAME:Admin}

  # Демо-пользователь demo@funnyenglish.app/demo123 — ТОЛЬКО для dev (DEMO_USER_ENABLED=true в docker-compose)
  demo-user:
    enabled: ${DEMO_USER_ENABLED:false}

logging:
  level:
    com.funnyenglish: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.springframework.web: ${WEB_LOG_LEVEL:WARN}
    org.apache.coyote.http11: ${TOMCAT_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator: только health (используется docker healthcheck и CI deploy check)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# HTTP client timeouts
rest:
  client:
    connect-timeout: 5000
    read-timeout: 30000
