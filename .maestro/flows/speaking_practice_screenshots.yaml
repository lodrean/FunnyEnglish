# Flow: capture Practice states (idle/recording/sent) for pixel-polish audit.
# Requires: docker-стек, demo@sotospeak.app/demo123 (DEMO_USER_ENABLED=true), seed-контент, Android-эмулятор.
# НЕ ИДЕМПОТЕНТЕН: backend-гейт DUPLICATE_SUBMISSION (409) — перед повторным прогоном
# очистить: docker exec sotospeak-postgres psql -U postgres -d sotospeak -c "DELETE FROM grades; DELETE FROM practice_submissions;"
appId: com.sotospeak.app
---
- launchApp:
    clearState: true
    permissions:
      android.permission.RECORD_AUDIO: allow

- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000

# Логин через Профиль (демо-юзер)
- tapOn: "Профиль"
- extendedWaitUntil:
    visible: ".*Уже есть аккаунт.*"
    timeout: 10000
- tapOn: "Войти"
- extendedWaitUntil:
    visible: "С возвращением!"
    timeout: 10000
- tapOn:
    point: "50%,25%"
- inputText: "demo@sotospeak.app"
- hideKeyboard
- tapOn:
    point: "50%,34%"
- inputText: "demo123"
- hideKeyboard
- tapOn: "Войти"

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000

# Topics → видео → Questions → Practice
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- tapOn: "Перейти к вопросам"
- extendedWaitUntil:
    visible: "Практика · 30 сек"
    timeout: 15000
- tapOn: "Практика · 30 сек"

# Practice idle (Ready): ring + record-кнопка + hint
- extendedWaitUntil:
    visible: "Начать запись"
    timeout: 15000
- assertVisible: "Контрольная · 30 сек"
- takeScreenshot: practice-idle

# Practice recording (~3 сек)
- tapOn: "Начать запись"
- extendedWaitUntil:
    visible: "0:27"
    timeout: 15000
- takeScreenshot: practice-recording

# Stop → автоотправка → Sent
- tapOn: "Остановить запись"
- extendedWaitUntil:
    visible: "Запись отправлена!"
    timeout: 20000
- assertVisible: "статус NEW · ждёт проверки"
- takeScreenshot: practice-sent
