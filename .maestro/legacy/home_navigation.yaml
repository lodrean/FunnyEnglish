# E2E тест навигации по главному экрану (гостевой режим)
appId: com.funnyenglish.app
---
- launchApp

# Первый запуск: онбординг → гостевой режим
- runFlow:
    when:
      visible: "Учим английский играючи"
    file: ../subflows/onboarding_guest.yaml

# Wait for home screen (guest mode)
- extendedWaitUntil:
    visible: "Категории"
    timeout: 10000

# Проверка всех вкладок навигации
- tapOn: "Главная"
- waitForAnimationToEnd
- assertVisible: ".*Привет!.*"

- tapOn: "Рейтинг"
- waitForAnimationToEnd
- assertVisible: ".*Рейтинг.*"

- tapOn: "Профиль"
- waitForAnimationToEnd
- assertVisible: "Профиль"

# Возврат на главную
- tapOn: "Главная"
- waitForAnimationToEnd
- assertVisible: "Категории"
