# FunnyEnglish E2E Test Suite
# Run all flows in sequence

flows:
  # Authentication Tests
  - maestro/flows/auth_flow.yaml
  
  # Home Screen Tests
  - maestro/flows/home_screen.yaml
  
  # Gamification Tests  
  - maestro/flows/gamification.yaml
  - maestro/flows/gamification_detailed.yaml
  
  # Test Completion Tests
  - maestro/flows/test_completion.yaml
  
  # Adaptive Lesson Tests
  - maestro/flows/adaptive_lesson.yaml
  
  # Profile & Settings Tests
  - maestro/flows/profile_settings.yaml
  
  # Leaderboard Tests
  - maestro/flows/leaderboard_social.yaml
  
  # Image-Word Match Tests
  - maestro/flows/image_word_match_play.yaml
  # - maestro/flows/image_word_match_admin.yaml  # Requires manual setup for file upload

# Test configuration
executionOrder: sequential
continueOnFailure: true

# Environment
env:
  TEST_USER_EMAIL: demo@funnyenglish.app
  TEST_USER_PASSWORD: demo123
  ADMIN_EMAIL: admin@funnyenglish.com
  ADMIN_PASSWORD: admin123

# Output
output:
  format: junit
  path: ./reports/maestro
