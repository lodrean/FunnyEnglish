# Flow: авторизованный пользователь — Practice: запись → ручной стоп → автоотправка → Sent → MySubmissions (спека §10.2)
# Требует: docker-стек, demo@sotospeak.app/demo123 (DEMO_USER_ENABLED=true), seed-контент.
# НЕ ИДЕМПОТЕНТЕН: backend-гейт DUPLICATE_SUBMISSION (409) — перед повторным прогоном
# очистить: docker exec sotospeak-postgres psql -U postgres -d sotospeak -c "DELETE FROM grades; DELETE FROM practice_submissions;"

appId: com.sotospeak.app
---
- launchApp:
    clearState: true
    permissions:
      android.permission.RECORD_AUDIO: allow

# Онбординг → гость (затем залогинимся через Профиль)
- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml

- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000

# Профиль → гостевой профиль (GuestProfileStub) → «Войти»
- tapOn: "Профиль"
- extendedWaitUntil:
    visible: ".*Уже есть аккаунт.*"
    timeout: 10000
- tapOn: "Войти"

# Логин demo-юзером (тапы по полям координатами — label-тап не переносит фокус в SpeakingField)
- extendedWaitUntil:
    visible: "С возвращением!"
    timeout: 10000
- tapOn:
    point: "50%,25%"
- inputText: "demo@sotospeak.app"
- hideKeyboard
- tapOn:
    point: "50%,34%"
- inputText: "demo123"
- hideKeyboard
- tapOn: "Войти"

# После логина — Библиотека (скроллим до seed-библиотеки)
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000

# Topics → видео → CTA «Перейти к вопросам» (bottom-sheet удалён, DC-5) → Questions
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- tapOn: "Перейти к вопросам"

# Questions → Practice (кнопка доступна авторизованному)
- extendedWaitUntil:
    visible: "Практика · 30 сек"
    timeout: 15000
- tapOn: "Практика · 30 сек"

# Practice: Ready → Recording
- extendedWaitUntil:
    visible: "Начать запись"
    timeout: 15000
- assertVisible: "Контрольная · 30 сек"
- assertVisible: ".*учителю автоматически.*"
- tapOn: "Начать запись"

# Запись ~3 сек по таймеру (0:30 → 0:27) → стоп по record-кнопке (contentDescription) → автоотправка
- extendedWaitUntil:
    visible: "0:27"
    timeout: 15000
- assertVisible: "Закончить и отправить"
- tapOn: "Остановить запись"

# Uploading → Sent
- extendedWaitUntil:
    visible: "Запись отправлена!"
    timeout: 20000
- assertVisible: "статус NEW · ждёт проверки"
- tapOn: "Вернуться в библиотеку"

# MySubmissions (bottom nav «Отправки») — статус NEW
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 10000
- tapOn: "Отправки"
- extendedWaitUntil:
    visible: "На проверке"
    timeout: 15000
- assertVisible: "Знакомство"
