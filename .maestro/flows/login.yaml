# Flow: гость проходит онбординг и попадает на стартовый экран — Библиотеку (пивот SPEAKING-TRAINER)
# Guest-first: Splash → Onboarding (3 слайда) → Library; гостевая сессия стартует синхронно,
# экран логина при старте не показывается.

appId: com.sotospeak.app
---
- launchApp

# Первый запуск: онбординг (3 слайда) → «Начать» → гостевой режим
- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml

# Стартовый экран после пивота — Библиотека speaking-тренажёра
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- assertVisible: ".*Библиотека тем.*"
