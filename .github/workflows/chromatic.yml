name: Chromatic Storybook

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: |
          cd admin-web
          npm ci --legacy-peer-deps

      - name: Build Storybook
        run: |
          cd admin-web
          npm run build-storybook

      # Секреты нельзя использовать в if: напрямую — проверка через step output.
      # Для реальной публикации нужен секрет CHROMATIC_TOKEN (docs/CHROMATIC_PLAYWRIGHT.md).
      - name: Check Chromatic token
        id: token-check
        run: |
          if [ -n "${{ secrets.CHROMATIC_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_TOKEN secret is not set — skipping Chromatic publish"
          fi

      - name: Publish to Chromatic
        if: steps.token-check.outputs.present == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}
          workingDir: admin-web
          storybookBuildDir: storybook-static
          exitOnceUploaded: true
          onlyChanged: true
          # Auto-accept changes on develop branch
          autoAcceptChanges: ${{ github.ref == 'refs/heads/develop' }}
