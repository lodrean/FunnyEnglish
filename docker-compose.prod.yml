# FunnyEnglish - Production Environment
# ======================================
# Отличия от dev docker-compose.yml:
#   - образы тянутся из ghcr.io (собираются CI, см. .github/workflows/deploy.yml),
#     а не билдятся из исходников;
#   - все секреты — через .env (см. docker/.env.example), НИЧЕГО не захардкожено;
#   - PostgreSQL и MinIO НЕ проброшены наружу (только внутренняя сеть);
#   - ddl-auto=validate (схемой управляет Flyway);
#   - S3_PUBLIC_URL обязателен (BUG-004): публичный URL, доступный с устройств.
#
# Использование:
#   cp docker/.env.example .env   # заполнить значения!
#   GITHUB_REPOSITORY=<org>/funnyenglish docker compose -f docker-compose.prod.yml up -d

name: funnyenglish-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: funnyenglish-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-funnyenglish}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # НЕ пробрасываем порт наружу — только внутренняя сеть
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: funnyenglish-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    command: server /data --console-address ":9001"
    # НЕ пробрасываем порты наружу; публичный доступ к файлам — через S3_PUBLIC_URL
    # (reverse-proxy/CDN перед MinIO либо внешний S3)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: funnyenglish-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-funnyenglish}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    restart: "no"

  # Caddy: единственная публичная точка входа (80/443) с автоматическим
  # Let's Encrypt. Backend/admin/minio наружу не смотрят.
  caddy:
    image: caddy:2-alpine
    container_name: funnyenglish-caddy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      ADMIN_HOST: ${ADMIN_HOST:?Set ADMIN_HOST in .env}
      MEDIA_HOST: ${MEDIA_HOST:?Set MEDIA_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY in .env}/backend:latest
    container_name: funnyenglish-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-funnyenglish}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate   # схемой управляет ТОЛЬКО Flyway
      SPRING_FLYWAY_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-funnyenglish}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL in .env (BUG-004)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      # Продовые логи — INFO (дефолт application.yml), DEBUG не включаем
    # Порт наружу НЕ пробрасываем — вход только через Caddy (API_HOST)
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  admin:
    image: ghcr.io/${GITHUB_REPOSITORY}/admin:latest
    container_name: funnyenglish-admin
    # Порт наружу НЕ пробрасываем — вход только через Caddy (ADMIN_HOST)
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # в nginx-контейнере localhost -> ::1, а nginx слушает IPv4 — используем 127.0.0.1
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
