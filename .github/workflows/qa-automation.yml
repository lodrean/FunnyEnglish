name: QA Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Unit Tests (Kotest)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Run Unit Tests
      run: ./gradlew :shared:allTests --no-daemon
    
    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          shared/build/reports/tests/
          shared/build/test-results/

  # 2. API Tests (Newman)
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: funnyenglish_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9010:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Start Backend
      env:
        DB_HOST: localhost
        DB_PORT: 5433
        DB_NAME: funnyenglish_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: test-secret-key-minimum-32-characters-long
        MINIO_ENDPOINT: http://localhost:9010
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin
      run: |
        ./gradlew -p backend bootRun --no-daemon &
        sleep 60  # Wait for backend to start
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Newman
      run: npm install -g newman newman-reporter-htmlextra
    
    - name: Run API Tests
      run: |
        newman run qa/postman/funnyenglish-api.json \
          -e qa/postman/test-environment.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export reports/api-test-report.html \
          --delay-request 100
    
    - name: Publish API Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-results
        path: reports/api-test-report.html

  # 3. E2E Tests (Maestro)
  e2e-tests:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    needs: api-tests
    if: false  # Disabled until mobile app is ready for CI
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Maestro
      run: |
        curl -Ls "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> $GITHUB_PATH
    
    - name: Build Android App
      run: ./gradlew :composeApp:assembleDebug --no-daemon
    
    - name: Run E2E Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        script: |
          adb install composeApp/build/outputs/apk/debug/composeApp-debug.apk
          maestro test .maestro/flows/
    
    - name: Publish E2E Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: ~/.maestro/tests/

  # 4. QA Agent (Visual Regression)
  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: false  # Disabled until baselines are established
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install QA Agent
      working-directory: ./qa-agent
      run: |
        pip install -e ".[dev]"
    
    - name: Download Baseline Screenshots
      uses: actions/download-artifact@v4
      with:
        name: baseline-screenshots
        path: qa-agent/baselines/
      continue-on-error: true
    
    - name: Run Visual Comparison
      working-directory: ./qa-agent
      run: |
        # This is a placeholder - actual implementation would:
        # 1. Take screenshots of current state
        # 2. Compare against baselines
        # 3. Generate reports
        echo "Visual regression tests would run here"
    
    - name: Publish Visual Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: visual-test-results
        path: qa-agent/reports/

  # Summary Job
  qa-summary:
    name: QA Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests]
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "## QA Automation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| API Tests | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Visual Tests | ${{ needs.visual-tests.result }} |" >> $GITHUB_STEP_SUMMARY
