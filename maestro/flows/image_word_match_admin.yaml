# Image-Word Match Admin Creation Flow
# Tests: Create an IMAGE_WORD_MATCH question through Admin Panel

appId: com.funnyenglish.desktop
---

# Admin Panel URL (web)
# Note: This flow assumes the admin web app is running at localhost:5173
# For mobile/desktop app testing, adjust selectors accordingly

- launchApp:
    appId: "com.funnyenglish.desktop"
    clearState: false

# Wait for home screen
- waitForElement:
    text: "FunnyEnglish"
    timeout: 10000

# Admin panel access through web browser
# For testing admin functionality, we use the web admin panel
- openLink: "http://localhost:5173/login"

# Wait for login screen
- waitForElement:
    text: "Вход в систему"
    timeout: 10000
    optional: true

- waitForElement:
    text: "Email"
    timeout: 5000

# Enter admin credentials
- tapOn:
    text: "Email"

- inputText: "${ADMIN_EMAIL}"

- tapOn:
    text: "Пароль"

- inputText: "${ADMIN_PASSWORD}"

# Submit login
- tapOn:
    text: "Войти"

# Wait for admin dashboard
- waitForElement:
    text: "Админ панель"
    timeout: 10000
    optional: true

- waitForElement:
    text: "Тесты"
    timeout: 5000

# Navigate to Tests
- tapOn:
    text: "Тесты"

# Wait for tests list
- waitForElement:
    text: "Создать тест"
    timeout: 5000

# Select first test to edit
- tapOn:
    text: "Редактировать"
    index: 0
    optional: true

# Wait for test editor
- waitForElement:
    text: "Вопросы"
    timeout: 5000

# Navigate to Questions tab
- tapOn:
    text: "Вопросы"

# Click Add Question
- tapOn:
    text: "Добавить вопрос"
    optional: true

- tapOn:
    text: "Создать вопрос"
    optional: true

# Select IMAGE_WORD_MATCH question type
- waitForElement:
    text: "Выберите тип вопроса"
    timeout: 5000

- tapOn:
    text: "Найди предмет"
    optional: true

- tapOn:
    text: "IMAGE_WORD_MATCH"
    optional: true

# Step 1: Upload Image
- waitForElement:
    text: "Upload Image"
    timeout: 5000

# Note: File upload in Maestro is limited
# This step may need manual intervention or API-based setup
- assertVisible:
    text: "Click to upload image"
    optional: true

# For automated testing, we skip actual file upload
# and assume image is uploaded via API or pre-seeded data
- tapOn:
    text: "Continue to Words"
    optional: true

# Step 2: Add Words
- waitForElement:
    text: "Add Words"
    timeout: 5000

# Add first word
- tapOn:
    text: "Word"
    optional: true

- inputText: "fridge"

- tapOn:
    text: "Translation"
    optional: true

- inputText: "холодильник"

- tapOn:
    text: "Add"
    optional: true

# Add second word
- tapOn:
    text: "Word"
    optional: true

- inputText: "table"

- tapOn:
    text: "Add"
    optional: true

# Add third word
- tapOn:
    text: "Word"
    optional: true

- inputText: "knife"

- tapOn:
    text: "Add"
    optional: true

# Continue to hotspots
- tapOn:
    text: "Continue"
    optional: true

# Step 3: Draw Hotspots
- waitForElement:
    text: "Draw Hotspots"
    timeout: 5000

# Select rectangle tool
- tapOn:
    text: "Draw Rectangle"
    optional: true

# Draw hotspot on image (coordinates are approximate)
- swipe:
    direction: RIGHT
    start: 10%,20%
    end: 25%,40%
    duration: 500
    optional: true

# Link hotspot to word
- tapOn:
    text: "Link to Word"
    optional: true

- tapOn:
    text: "fridge"
    optional: true

# Draw second hotspot
- swipe:
    direction: RIGHT
    start: 40%,50%
    end: 60%,65%
    duration: 500
    optional: true

- tapOn:
    text: "Link to Word"
    optional: true

- tapOn:
    text: "table"
    optional: true

# Draw third hotspot
- swipe:
    direction: RIGHT
    start: 70%,30%
    end: 80%,40%
    duration: 500
    optional: true

- tapOn:
    text: "Link to Word"
    optional: true

- tapOn:
    text: "knife"
    optional: true

# Check progress - all words linked
- assertVisible:
    text: "3 of 3 words linked"
    optional: true

# Preview
- tapOn:
    text: "Preview"
    optional: true

# Step 4: Save Question
- waitForElement:
    text: "Preview"
    timeout: 3000

- tapOn:
    text: "Save Question"
    optional: true

- tapOn:
    text: "Сохранить"
    optional: true

# Verify question created
- waitForElement:
    text: "Вопрос создан"
    timeout: 5000
    optional: true

- assertVisible:
    text: "IMAGE_WORD_MATCH"
    optional: true

# Navigate back to dashboard
- tapOn:
    text: "Тесты"
    optional: true

- assertVisible:
    text: "Админ панель"
    optional: true
