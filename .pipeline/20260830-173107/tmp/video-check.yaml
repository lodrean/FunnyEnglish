appId: com.sotospeak.app
---
- launchApp
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: video-idle
- tapOn:
    point: "50%,27%"
- extendedWaitUntil:
    visible: "0:0[0-9] / 0:10"
    timeout: 10000
- takeScreenshot: video-playing
