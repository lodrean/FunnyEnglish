name: CMP E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'design/**'
      - 'e2e-cmp/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'design/**'
      - 'e2e-cmp/**'

jobs:
  cmp-e2e-tests:
    name: CMP WASM E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sotospeak_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9010:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e2e-cmp/package-lock.json
        
    - name: Install dependencies
      run: |
        cd e2e-cmp
        npm ci
        
    - name: Install Playwright browsers
      run: |
        cd e2e-cmp
        npx playwright install --with-deps chromium
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # playwright webServer запускает ../gradlew — Windows не хранит exec-bit в git
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Backend для e2e: seed-контент и API обязательны (global-setup purge, WASM идёт в API 8080)
    - name: Start Backend
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: sotospeak_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        JWT_SECRET: test-secret-key-minimum-32-characters-long
        S3_ENDPOINT: http://localhost:9010
        S3_PUBLIC_URL: http://localhost:9010
        S3_ACCESS_KEY: minioadmin
        S3_SECRET_KEY: minioadmin
        ADMIN_PASSWORD: admin123
        DEMO_USER_ENABLED: "true"
      run: |
        ./gradlew -p backend bootRun --no-daemon > backend-bootrun.log 2>&1 &
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/api/actuator/health > /dev/null 2>&1; then
            echo "Backend is up after ~$((i*5))s"
            exit 0
          fi
          sleep 5
        done
        echo "::error::Backend did not start in 300s — bootRun log:"
        tail -200 backend-bootrun.log
        exit 1

    - name: Create MinIO bucket
      # один контейнер: alias через MC_HOST_ env (alias set не персистит между docker run)
      run: docker run --rm --network host -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9010 minio/mc mb --ignore-existing local/sotospeak

    - name: Seed speaking content
      run: ./scripts/seed-speaking-content.sh http://localhost:8080/api admin@sotospeak.com admin123

    - name: Run CMP E2E tests
      run: |
        cd e2e-cmp
        npx playwright test --reporter=line
      env:
        CI: true
        E2E_API_URL: http://localhost:8080/api
        GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cmp-e2e-results
        path: |
          e2e-cmp/playwright-report/
          e2e-cmp/test-results/
        retention-days: 7
        
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cmp-screenshots
        path: e2e-cmp/test-results/*.png
        retention-days: 7
