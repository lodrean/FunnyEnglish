name: Quality Assurance Cycle

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  # Backend Quality Checks
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Start Backend Services
        run: docker compose up -d postgres minio
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Backend Tests
        run: ./gradlew :backend:test
      
      - name: Generate Coverage Report
        run: ./gradlew :backend:koverHtmlReport
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/kover/html

  # Admin Web Quality Checks
  admin-web-quality:
    name: Admin Web Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-web
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './admin-web/package-lock.json'
      
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Typecheck
        run: npm run typecheck
      
      - name: Run Unit Tests
        # vitest напрямую: npm-скрипт «test» — watch-режим (грабля №69)
        run: npx vitest run --coverage
      
      - name: Build Project
        run: npm run build
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-coverage
          path: admin-web/coverage

  # Compose App Quality Checks
  compose-app-quality:
    name: Compose App Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Compile Desktop
        run: ./gradlew :composeApp:compileKotlinDesktop
      
      - name: Run Tests
        run: ./gradlew :composeApp:desktopTest
      
      - name: Generate Coverage
        run: ./gradlew :composeApp:koverHtmlReport
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: compose-app-coverage
          path: composeApp/build/reports/kover/html

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-quality, admin-web-quality]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './admin-web/package-lock.json'
      
      - name: Install Admin Web Dependencies
        working-directory: ./admin-web
        run: npm ci --legacy-peer-deps
      
      - name: Install Playwright
        working-directory: ./admin-web
        run: npx playwright install --with-deps

      # docker-compose build копирует готовый backend jar — собираем заранее
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build backend jar
        run: ./gradlew :backend:bootJar

      - name: Start Services
        run: docker compose up -d

      - name: Wait for Services
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/api/actuator/health > /dev/null 2>&1 && \
               curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Services up after ~$((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Services not ready in 180s"
          docker compose ps
          docker compose logs --tail 50 backend admin
          exit 1
      
      - name: "Smoke: admin login via API"
        run: |
          echo "== direct backend login =="
          curl -s -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@sotospeak.com","password":"admin123"}' | head -c 120
          echo
          echo "== via nginx proxy (admin:3000) =="
          curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@sotospeak.com","password":"admin123"}' | head -c 120
          echo

      - name: Run E2E Tests
        working-directory: ./admin-web
        # Скрипта test:e2e:headless нет; прогон против docker-админки (3000), без webServer
        run: npx playwright test
        env:
          SKIP_WEB_SERVER: "1"
          ADMIN_URL: http://localhost:3000
      
      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs --tail 120 backend | grep -iE "admin|initializer|flyway|error|exception" | tail -40 || true

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            admin-web/playwright-report
            admin-web/test-results

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # upload-sarif требует security-events: write (иначе «Resource not accessible by integration»)
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Quality Summary
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, admin-web-quality, compose-app-quality, e2e-tests]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate Summary
        run: |
          echo "# Quality Assurance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Web | ${{ needs.admin-web-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compose App | ${{ needs.compose-app-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
