# Flow: гость — полный путь Library → Topics → Video → Questions → Training (спека §10.2)
# Требует: docker-стек с seed-контентом («Разговорный английский» / «Знакомство»).
# Запись на эмуляторе — виртуальный микрофон, permissions выдаются при запуске.

appId: com.sotospeak.app
---
- launchApp:
    clearState: true
    permissions:
      android.permission.RECORD_AUDIO: allow

# Онбординг → гость
- runFlow:
    when:
      visible: "Смотри видео"
    file: ../subflows/onboarding_guest.yaml

# Library — стартовый экран (E2E-библиотеки могут быть сверху — скроллим до seed)
- extendedWaitUntil:
    visible: ".*Библиотека тем.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Разговорный английский"
    direction: DOWN
    timeout: 30000
- assertVisible: "Разговорный английский"

# Topics
- tapOn: "Разговорный английский"
- extendedWaitUntil:
    visible: "Знакомство"
    timeout: 15000
- tapOn: "Знакомство"

# Video: bottom-sheet удалён (DC-5) — клик по топику открывает сразу видео,
# mode-chips «С субтитрами/Без субтитров» на экране видео (seed-топик с субтитрами)
- extendedWaitUntil:
    visible: "Перейти к вопросам"
    timeout: 15000
- assertVisible: "С субтитрами"
- tapOn: "Без субтитров"

# CTA «Перейти к вопросам» доступен всегда (видео может не грузиться с эмулятора — не критично)
- tapOn: "Перейти к вопросам"

# Questions — весь список вопросов
- extendedWaitUntil:
    visible: "What is your name?"
    timeout: 15000
- assertVisible: "Where are you from?"
- tapOn: "Тренировка · 3 попытки"

# Training — уровень 1, лимит 80 сек, одна запись на все вопросы
- extendedWaitUntil:
    visible: "Уровень 1 · 80 сек"
    timeout: 15000
- assertVisible: ".*ответь на все вопросы одной записью.*"

# Запись: record-кнопка (contentDescription) → ~3 сек по таймеру (1:20 → 1:17) → стоп
# (досрочный стоп засчитывается)
- tapOn: "Начать запись"
- extendedWaitUntil:
    visible: "1:17"
    timeout: 15000
- tapOn: "Остановить запись"

# Попытка сохранена, ✅ автоматически; заголовок списка «Попытки · N из 3»
- extendedWaitUntil:
    visible: "Попытка 1"
    timeout: 10000
- assertVisible: "Попытки · 1 из 3"

# Следующий уровень разблокирован
- assertVisible: "Уровень 2 · 50 сек"
