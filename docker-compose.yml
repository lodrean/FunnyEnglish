# So to speak - Dev Environment
# Simple setup for local development and testing
#
# Quick Start:
#   docker compose up -d
#
# Services:
#   - Backend API:    http://localhost:8080
#   - Admin Panel:    http://localhost:3000
#   - MinIO Console:  http://localhost:9001
#   - PostgreSQL:     localhost:5432
#
# Default Credentials:
#   Admin Panel:    admin@sotospeak.com / admin123
#   MinIO:          minioadmin / minioadmin
#   Database:       postgres / postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: sotospeak-postgres
    environment:
      POSTGRES_DB: sotospeak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sotospeak-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot MinIO initializer: creates bucket + public policy (docker/minio-init.sh)
  minio-init:
    image: minio/mc:latest
    container_name: sotospeak-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio-init.sh:/init.sh:ro
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sotospeak-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sotospeak
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: true
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: sotospeak
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/sotospeak}
      JWT_SECRET: sotospeak_dev_jwt_secret_key_32chars
      ADMIN_EMAIL: admin@sotospeak.com
      ADMIN_PASSWORD: admin123
      ADMIN_DISPLAY_NAME: Admin
      CORS_ORIGINS: ${CORS_ORIGINS:-"http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:8082,http://localhost:8085,http://192.168.1.148:3000,http://192.168.1.148:8081,http://192.168.1.148:8082,http://192.168.1.148:8085"}
      DEMO_USER_ENABLED: "true"   # dev only: demo@sotospeak.app/demo123
      # dev only: высокие лимиты для E2E-прогонов (в prod env не выставлять — дефолт 5/мин на login)
      RATE_LIMIT_LOGIN_CAPACITY: "100"
      RATE_LIMIT_REGISTER_CAPACITY: "50"
      LOG_LEVEL: DEBUG
      SECURITY_LOG_LEVEL: DEBUG
      WEB_LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    volumes:
      # файловый лог backend (logging.file.name=logs/backend.log) переживает контейнер
      - ./logs/backend:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_URL: /api
    container_name: sotospeak-admin
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
